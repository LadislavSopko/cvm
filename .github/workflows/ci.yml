name: CI

on:
  pull_request:
    branches: [production]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use the public npm registry for locked tarballs
        run: sed -i 's#https://nexus.0ics.ai/repository/npm-group/#https://registry.npmjs.org/#g' package-lock.json
      - run: npm ci
      - run: npx nx run-many --target=build --all
      - run: npx nx run-many --target=typecheck --all --skip-nx-cache
      - run: npx nx run-many --target=lint --all
      - run: npx nx run-many --target=test --all --skip-nx-cache
      - run: bash test/programs/run-all-tests.sh
